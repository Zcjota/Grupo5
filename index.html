<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad 2 Junior Aguilar Leaños</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
    }

    header {
      background: linear-gradient(90deg, #0073e6, #005bb5);
      padding: 20px;
      text-align: center;
      animation: slideDown 1s ease-out;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 5px;
      color: #ffffff;
    }

    header p {
      font-size: 16px;
      color: #cce6ff;
      font-style: italic;
    }

    .iframe-container {
      position: absolute;
      top: 90px; /* altura del header */
      bottom: 40px; /* altura del footer */
      left: 0;
      right: 0;
      padding: 10px;
      animation: fadeIn 1.5s ease-in;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 115, 230, 0.4);
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: #1e1e1e;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      color: #aaa;
      animation: fadeIn 2s ease-in;
    }

    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard - Actividad 2</h1>
    <p>Junior Aguilar Leaños | Ingeniería de Sistemas</p>
  </header>

  <div class="iframe-container">
    <iframe 
      title="Actividad2_JuniorAguilar"
      src="https://app.powerbi.com/reportEmbed?reportId=3a905921-9345-4b97-9c08-b452911dba4c&autoAuth=true&ctid=cf263038-f11c-49d2-9183-556a34b747e2"
      allowFullScreen="true">
    </iframe>
  </div>

  <footer>
    © 2025 - Universidad | Actividad 2 
  </footer>

</body>
</html>
