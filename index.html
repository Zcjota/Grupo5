<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Tesorería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            margin: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            margin: auto;
            overflow-x: auto;
        }
        .section-title {
            background-color: #0073e6;
            color: white;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            border-radius: 5px;
            margin-top: 10px;
        }
        .section-content {
            display: none;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #222;
        }
        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
            min-width: 80px;
        }
        th {
            background-color: #005bb5;
            color: white;
        }
        .fecha {
            font-size: 14px;
            color: #00ff00;
            font-weight: bold;
        }
        .encargado {
            font-size: 12px;
            color: #ffa500;
            font-style: italic;
        }
        .flecha {
            display: inline-block;
            height: 5px;
            background-color: #00ff00;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h2>Diagrama de Riesgos en Tesorería</h2>
    <div class="container" id="auditSections"></div>

    <script>
        const riesgosData = [
            {
                seccion: "Autorización de Transferencias Externas",
                riesgos: [
                    {
                        proceso: "Riesgo 1: Errores en la verificación de campos obligatorios",
                        actividad: "- Revisión de registros.<br>- Validación de controles.<br>- Pruebas de cumplimiento.",
                        fechas: [{ inicio: 1, fin: 2 }],
                        encargado: "Ing. Johannes Machado Paz (Auditoría de Sistemas)"
                    },
                    {
                        proceso: "Riesgo 2: Modificación maliciosa de datos",
                        actividad: "- Análisis forense de registros de transferencias.<br>- Revisión de logs.<br>- Pruebas de seguridad.",
                        fechas: [{ inicio: 3, fin: 3 }, { inicio: 5, fin: 6 }],
                        encargado: "Ing. Pacaje Arias Marcos (Seguridad Informática)"
                    },
                    {
                        proceso: "Riesgo 3: Falta de validación en el formato de datos",
                        actividad: "- Prueba de integridad de datos.<br>- Simulación de datos incorrectos.<br>- Entrevistas con TI.",
                        fechas: [{ inicio: 7, fin: 8 }],
                        encargado: "Ing. Daniel Tapia Morales (Seguridad Informática)"
                    }
                ]
            },
            {
                seccion: "Captura de Errores Operativos",
                riesgos: [
                    {
                        proceso: "Riesgo 1: Identificación incorrecta de errores operativos",
                        actividad: "- Revisión de reportes de fallos.<br>- Análisis de patrones en los errores detectados.<br>- Pruebas de verificación de errores manuales y automáticos.",
                        fechas: [{ inicio: 1, fin: 2 }, { inicio: 4, fin: 5 }],
                        encargado: "Ing. Jaime Junio Aguilar Leaños (Auditor Líder de Sistemas)"
                    },
                    {
                        proceso: "Riesgo 2: Falta de registro de errores menores",
                        actividad: "- Implementación de un sistema de log detallado.<br>- Auditoría de registros.<br>- Evaluación del impacto de errores recurrentes.",
                        fechas: [{ inicio: 6, fin: 7 }],
                        encargado: "Ing. Johannes Machado Paz (Auditoría de Sistemas)"
                    },
                    {
                        proceso: "Riesgo 3: Falta de seguimiento a errores",
                        actividad: "- Creación de un protocolo de respuesta.<br>- Asignación de responsabilidades.<br>- Monitoreo de cumplimiento.",
                        fechas: [{ inicio: 9, fin: 10 }],
                        encargado: "Ing. Pacaje Arias Marcos (Seguridad Informática)"
                    }
                ]
            },
            {
                seccion: "Verificación de Autenticación",
                riesgos: [
                    {
                        proceso: "Riesgo 1: Uso de credenciales robadas",
                        actividad: "- Monitoreo de accesos sospechosos.<br>- Revisión de políticas de seguridad.<br>- Implementación de bloqueo automático tras intentos fallidos.",
                        fechas: [{ inicio: 2, fin: 3 }],
                        encargado: "Ing. Daniel Tapia Morales (Seguridad Informática)"
                    },
                    {
                        proceso: "Riesgo 2: Métodos de autenticación débiles",
                        actividad: "- Implementación de autenticación multifactor (MFA).<br>- Validación de contraseñas seguras.<br>- Actualización de protocolos de acceso.",
                        fechas: [{ inicio: 5, fin: 6 }],
                        encargado: "Ing. Pacaje Arias Marcos (Seguridad Informática)"
                    },
                    {
                        proceso: "Riesgo 3: Exposición de datos sensibles",
                        actividad: "- Encriptación de datos en tránsito.<br>- Evaluación de vulnerabilidades.<br>- Implementación de conexiones seguras.",
                        fechas: [{ inicio: 8, fin: 9 }],
                        encargado: "Ing. Johannes Machado Paz (Auditoría de Sistemas)"
                    }
                ]
            },
            {
                seccion: "Confirmación de Disponibilidad de Fondos",
                riesgos: [
                    {
                        proceso: "Riesgo 1: Cálculos incorrectos debido a errores en el sistema",
                        actividad: "- Validación de algoritmos de cálculo.<br>- Revisión de pruebas de estrés en el sistema.<br>- Implementación de alertas de error.",
                        fechas: [{ inicio: 3, fin: 4 }],
                        encargado: "Ing. Jaime Junio Aguilar Leaños (Auditor Líder de Sistemas)"
                    },
                    {
                        proceso: "Riesgo 2: Actualización desfasada del saldo en cuentas",
                        actividad: "- Sincronización en tiempo real de saldos.<br>- Implementación de validaciones cruzadas.<br>- Auditoría de registros de saldo.",
                        fechas: [{ inicio: 6, fin: 7 }],
                        encargado: "Ing. Johannes Machado Paz (Auditoría de Sistemas)"
                    },
                    {
                        proceso: "Riesgo 3: Acceso no autorizado que permite alteraciones en los saldos",
                        actividad: "- Monitoreo continuo de transacciones.<br>- Revisión de seguridad en bases de datos.<br>- Implementación de registros de auditoría.",
                        fechas: [{ inicio: 9, fin: 10 }],
                        encargado: "Ing. Pacaje Arias Marcos (Seguridad Informática)"
                    }
                ]
            }
        ];

        function generarSecciones() {
            const container = document.getElementById("auditSections");

            riesgosData.forEach(seccion => {
                const sectionDiv = document.createElement("div");

                const title = document.createElement("div");
                title.classList.add("section-title");
                title.textContent = ` ${seccion.seccion}`;
                title.addEventListener("click", () => {
                    const content = title.nextElementSibling;
                    content.style.display = content.style.display === "block" ? "none" : "block";
                });

                const sectionContent = document.createElement("div");
                sectionContent.classList.add("section-content");

                const table = document.createElement("table");
                table.innerHTML = `<thead><tr>
                        <th>Proceso - Auditorías</th>
                        <th>Actividades</th>
                        <th>Encargado</th>
                    </tr></thead>`;

                const tbody = document.createElement("tbody");

                seccion.riesgos.forEach(riesgo => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${riesgo.proceso}</td><td>${riesgo.actividad}</td><td>${riesgo.encargado}</td>`;
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                sectionContent.appendChild(table);
                sectionDiv.appendChild(title);
                sectionDiv.appendChild(sectionContent);
                container.appendChild(sectionDiv);
            });
        }

        generarSecciones();
    </script>
</body>
</html>
